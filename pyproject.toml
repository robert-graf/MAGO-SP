[project]
name = "mago-sp"
version = "0.0.0"
description = "MAGO-SP: Detection and Correction of Water-Fat Swaps in Magnitude-Only VIBE MRI. See papers/vibe_inversion/pipeline.py for the entry points."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache License Version 2.0, January 2004" }
authors = [
    { name = "Robert Graf", email = "robert.graf@tum.de" },
    { name = "Hendrik Möller", email = "hendrik.moeller@tum.de" },
]

# MAGO-SP is not published on PyPI — the intended install is a sibling clone
# next to the caller repo (see GLP1/README.md). These are the direct third-party
# runtime deps; version-pinning is intentionally lax because the repo works
# against whatever PyTorch + TPTBox the caller has already installed.
dependencies = [
    "TPTBox",
    "torch",
    "numpy",
    "scipy",
    "nibabel",
    "joblib",
    "numba",
    "tqdm",
    "tqdm-joblib",
    "einops",
    "omegaconf",
    "packaging",
    "Pillow",
    "pytorch-lightning",
    "torchmetrics",
    "torchvision",
    "nnunetv2",
]

[project.urls]
paper = "https://papers.miccai.org/miccai-2025/paper/0269_paper.pdf"
poster = "https://epos.myesr.org/poster/esr/ecr2026/C-24425"

[tool.ruff]
exclude = [
    "*.ipynb",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "logs",
]
line-length = 140
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C901",
    "I",
    "UP",
    "ASYNC",
    "BLE",
    "B",
    "A",
    "C4",
    "ICN",
    "G",
    "INP",
    "PIE",
    "PYI",
    "SIM",
    "TID",
    "INT",
    "ARG",
    "TD005",
    "FIX003",
    "FIX004",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "NPY",
    "AIR",
    "PERF",
    "FURB",
    "RUF",
]

ignore = [
    "C901",
    "RUF002",
    "RUF059",
    "RUF100",
    "F401",
    "BLE001",
    "E501",
    "N801",
    "N802",
    "N803",
    "N806",
    "N999",
    "E741",
    "F811",
    "SIM105",
    "SIM112",
    "SIM118",
    "PD002",
    "PERF203",
    "PGH003",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW0108",
    "PTH123",
    "TRY003",
    "TRY301",
    "NPY002",
    "FURB171",
    "B905",
    "UP007",
    "INP001",
]

fixable = ["ALL"]
unfixable = []
extend-safe-fixes = ["RUF015", "C419", "C408", "B006"]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
